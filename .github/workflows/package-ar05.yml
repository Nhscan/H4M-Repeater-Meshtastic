name: Package H4M ar05 for SD flashing
on:
  push:
    branches: [build/meshtastic-key-import-ar05]
    paths: [.github/workflows/package-ar05.yml]
permissions:
  actions: read
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: h4m-ar05
          run-id: 43456182814
          github-token: ${{ github.token }}
          path: incoming
      - name: Assemble matching SD card and Flash Utility package
        shell: python
        run: |
          import hashlib, shutil, subprocess, tarfile, zipfile
          from pathlib import Path
          root = Path("delivery/H4M-Meshtastic-ar05")
          sd = root / "SD_CARD"
          sd.mkdir(parents=True)
          with tarfile.open("incoming/portapack-mayhem_OCI.ppfw.tar") as tar:
              for m in tar.getmembers():
                  assert not m.name.startswith("/") and ".." not in Path(m.name).parts
                  assert Path(m.name).parts[0] in ("APPS", "BASEBAND", "FIRMWARE")
              tar.extractall(sd, filter="data")
          image = sd / "FIRMWARE/portapack-mayhem_n_261109_ar05.bin"
          assert image.stat().st_size == 1048576
          assert len(list((sd/"APPS").glob("*.ppma"))) == 104
          assert len(list((sd/"APPS").glob("*.ppmp"))) == 2
          update = sd / "FIRMWARE/H4M_AR05_FIX.ppfw.tar"
          # Put all support files before the actual firmware image.
          with tarfile.open(update, "w", format=tarfile.USTAR_FORMAT) as tar:
              for folder in ("APPS", "BASEBAND"):
                  tar.add(sd/folder, arcname=folder, recursive=False)
                  for file in sorted((sd/folder).iterdir()):
                      tar.add(file, arcname=file.relative_to(sd).as_posix())
              tar.add(sd/"FIRMWARE", arcname="FIRMWARE", recursive=False)
              tar.add(image, arcname=image.relative_to(sd).as_posix())
          # Emulate the embedded extractor: only regular files and directories.
          raw = update.read_bytes()
          offset = 0
          dirs = set()
          last_bin = None
          while any(raw[offset:offset+512]):
              header = raw[offset:offset+512]
              assert len(header) == 512
              name = header[:100].split(b"\\0")[0].decode()
              kind = header[156:157]
              size = int(header[124:136].strip(b"\\0 "), 8)
              assert kind in (b"0", b"\\0", b"5"), (name, kind)
              if kind == b"5":
                  dirs.add(name.rstrip("/"))
              else:
                  assert str(Path(name).parent) in dirs, name
                  if name.endswith(".bin"): last_bin = name
              offset += 512 + ((size+511)//512)*512
          assert last_bin == "FIRMWARE/"+image.name
          print("PASS embedded TAR header types, parent directories and last firmware image")
          subprocess.run(["python3", "tests/auto_repeater/check_update_archive.py", str(update), "n_261109_ar05"], check=True)
          (root/"START-HERE.txt").write_text(
              "H4M Meshtastic ar05 - HackRF One + PortaPack H4M\n\n"
              "1. Extract this ZIP. Copy everything INSIDE SD_CARD to the SD card root.\n"
              "   Merge folders and replace matching files. Keep your other SD card data.\n"
              "2. Insert the SD card and open Utilities > Flash Utility on the PortaPack.\n"
              "3. Choose H4M_AR05_FIX.ppfw.tar from FIRMWARE. Wait for completion and reboot.\n"
              "4. Check About shows n_261109_ar05.\n\n"
              "FIRMWARE also contains the matching 1 MiB .bin for compatible BIN flashing.\n"
              "APPS and BASEBAND must be copied from this same build.\n"
              "This package updates firmware/support files and retains existing SD resources.\n\n"
              "Custom channels accept blank (open), 32/64 hex digits, or padded Base64 keys.\n"
              "Select a custom channel and use Import key for an SD .TXT containing only the key.\n"
              "Hardware interoperability testing is pending.\n")
          usb = root / "USB_FLASH_WINDOWS"
          shutil.copytree("flashing", usb)
          (usb/"firmware").mkdir()
          shutil.copy2(image, usb/"firmware/firmware_hackrf.bin")
          (usb/"START_H4M.bat").write_bytes("@echo off\r\nsetlocal\r\npushd \"%~dp0\"\r\necho H4M / HackRF One ONLY - custom Mayhem n_261109_ar05\r\necho.\r\necho 1. Close other SDR programs and connect just this HackRF by USB.\r\necho 2. Select HackRF mode on the H4M. After DFU recovery, it is already in that mode.\r\necho 3. Keep the USB cable connected until the read-back check completes.\r\necho.\r\npause\r\n\"utils\\hackrf_info.exe\"\r\nif errorlevel 1 goto failed\r\nif exist \"H4M-before-flash.bin\" goto backup_done\r\n\"utils\\hackrf_spiflash.exe\" -l 1048576 -r \"H4M-before-flash.bin\"\r\nif errorlevel 1 goto failed\r\n:backup_done\r\n\"utils\\hackrf_spiflash.exe\" -w \"firmware\\firmware_hackrf.bin\"\r\nif errorlevel 1 goto failed\r\n\"utils\\hackrf_spiflash.exe\" -l 1048576 -r \"H4M-readback.bin\"\r\nif errorlevel 1 goto failed\r\nfc /b \"firmware\\firmware_hackrf.bin\" \"H4M-readback.bin\" >nul\r\nif errorlevel 1 goto mismatch\r\necho.\r\necho SUCCESS: Flash read-back matches the custom firmware byte for byte.\r\necho Restart the H4M, check About shows n_261109_ar05, then open both TRX apps.\r\npause\r\npopd\r\nexit /b 0\r\n:mismatch\r\necho ERROR: Flash read-back did not match. Do not assume installation succeeded.\r\ngoto finish_error\r\n:failed\r\necho ERROR: USB operation failed. The new firmware has NOT been verified.\r\necho Check cable, HackRF mode and drivers. See START-HERE.txt for recovery.\r\n:finish_error\r\npause\r\npopd\r\nexit /b 1\r\n\r\n".encode())
          (usb/"START_AR05.bat").write_bytes(b'@echo off\r\ncall "%~dp0START_H4M.bat"\r\n')
          assert (usb/"utils/hackrf_spiflash.exe").is_file()
          assert (usb/"utils/hackrf_info.exe").is_file()
          assert (usb/"firmware/firmware_hackrf.bin").read_bytes() == image.read_bytes()
          (root/"START-HERE.txt").write_text((root/"START-HERE.txt").read_text()+"\nWINDOWS USB ALTERNATIVE\nCopy SD_CARD contents first. Connect USB and select HackRF mode on the H4M.\nOpen USB_FLASH_WINDOWS and run START_H4M.bat. It backs up flash, writes ar05,\nthen reads it back and compares every byte. Wait for SUCCESS before restarting.\n")
          (root/"SHA256SUMS.txt").write_text("".join(
              hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.relative_to(root).as_posix()+"\n"
              for p in sorted(root.rglob("*")) if p.is_file()))
          with zipfile.ZipFile("delivery/H4M-Meshtastic-ar05-SD-and-Flash.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file(): z.write(p, p.relative_to(root.parent))
          print("PASS: SD_CARD/APPS, BASEBAND, FIRMWARE, update archive, raw image and checksums")
      - uses: actions/upload-artifact@v4
        with:
          name: H4M-Meshtastic-ar05-SD-and-Flash
          path: delivery/H4M-Meshtastic-ar05-SD-and-Flash.zip
          if-no-files-found: error
